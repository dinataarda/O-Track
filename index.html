<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O-Track | Premium Field App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        :root { --bg-base: #09090b; --surface: rgba(255, 255, 255, 0.03); --surface-hover: rgba(255, 255, 255, 0.06); --border: rgba(255, 255, 255, 0.08); --accent: #06b6d4; --accent-glow: rgba(6, 182, 212, 0.4); --text-main: #f8fafc; --text-dim: #94a3b8; --danger: #ef4444; --danger-glow: rgba(239, 68, 68, 0.2); --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px; --ease-out: cubic-bezier(0.16, 1, 0.3, 1); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg-base); background-image: radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%); color: var(--text-main); margin: 0; padding: 24px 20px; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 420px; position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 95vh; transition: 0.3s;}
        .main-content { flex: 1; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.7s var(--ease-out) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-left h1 { font-size: 1.25rem; letter-spacing: -0.5px; margin: 0; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        .header-left h1::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent-glow); }
        .header-right { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border); backdrop-filter: blur(12px); }
        .btn-header { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 8px; border-radius: 10px; transition: 0.2s; }
        .btn-header:hover { background: var(--surface-hover); color: var(--text-main); }
        .btn-header svg { width: 18px; height: 18px; }
        .weather-widget { font-size: 0.7rem; color: var(--text-dim); font-weight: 600; margin-top: 6px; }

        .main-card { background: rgba(20, 25, 35, 0.4); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 24px; text-align: center; position: relative; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700; margin-bottom: 8px; }
        .total-display { font-size: 2.75rem; font-weight: 900; margin-bottom: 24px; letter-spacing: -1.5px; line-height: 1.1; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .settings-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
        .setting-badge { font-size: 0.75rem; color: var(--text-dim); cursor: pointer; padding: 8px 16px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); font-weight: 600; }
        .input-group { position: relative; margin-bottom: 24px; }
        input[type="number"] { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px 50px 20px 20px; color: var(--accent); font-size: 2.5rem; font-weight: 900; text-align: center; outline: none; }
        input[type="number"]:focus { border-color: var(--accent); background: rgba(6, 182, 212, 0.03); }
        .btn-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%) scale(0.8); background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s; }
        .btn-clear.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
        .btn-main { width: 100%; background: var(--text-main); color: var(--bg-base); border: none; padding: 18px; border-radius: var(--radius-md); font-weight: 800; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; margin-top: 8px; }

        .history-section { margin-top: 40px; }
        .summary-card { background: linear-gradient(145deg, rgba(6, 182, 212, 0.1), transparent); border: 1px solid rgba(6, 182, 212, 0.2); border-radius: var(--radius-md); padding: 24px; margin-bottom: 24px; backdrop-filter: blur(10px); }
        .summary-header { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .summary-body { display: flex; justify-content: space-between; align-items: flex-end; }
        .summary-qty { font-size: 2rem; font-weight: 900; line-height: 1; letter-spacing: -1px; }
        .summary-qty span { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); margin-left: 6px; }
        .summary-rp { font-size: 1.25rem; font-weight: 800; opacity: 0.9;}
        
        .btn-export { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.65rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .history-item { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; opacity: 0; animation: fadeUp 0.5s forwards; animation-delay: calc(var(--delay) * 0.05s); }
        .history-item-qty { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; }
        .history-item-time { font-size: 0.65rem; color: var(--text-dim); margin-top: 6px; font-weight: 600; }
        .history-right { display: flex; align-items: center; gap: 16px; }
        .history-item-total { color: var(--accent); font-weight: 700; font-size: 0.95rem; }
        .btn-del-item { background: transparent; border: none; color: var(--text-dim); cursor: pointer; }
        .btn-del-item svg { width: 18px; height: 18px; }

        #toast { position: fixed; top: 24px; left: 50%; transform: translate(-50%, -40px) scale(0.9); background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 24px; border-radius: 100px; font-weight: 700; font-size: 0.75rem; opacity: 0; pointer-events: none; transition: 0.4s; display: flex; align-items: center; gap: 10px; z-index: 999; }
        #toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
        #toast svg { width: 16px; height: 16px; color: var(--accent); }

        .watermark-footer { text-align: center; padding: 30px 0 20px 0; color: var(--text-dim); font-size: 0.7rem; opacity: 0.6; letter-spacing: 0.5px; margin-top: auto; }
        .watermark-footer strong { color: var(--text-main); font-weight: 700; }

        /* DESKTOP RESPONSIVENESS */
        @media (min-width: 768px) {
            .container { max-width: 900px; padding-top: 20px; }
            .desktop-layout { display: grid; grid-template-columns: 380px 1fr; gap: 40px; align-items: start; }
            .history-section { margin-top: 0; }
        }
    </style>
</head>
<body>
    <div id="toast"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg><span id="toast-msg">DATA TERSIMPAN</span></div>

    <div class="container">
        <div class="main-content">
            <header class="animate-fade-up">
                <div class="header-left"><h1>O-TRACK</h1><div id="weather" class="weather-widget">📡 Mengecek cuaca...</div></div>
                <div class="header-right">
                    <button onclick="backupData()" class="btn-header" title="Backup Data"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"></path></svg></button>
                    <button onclick="triggerRestore()" class="btn-header" title="Restore Data"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9.75v6.75m0 0l-3-3m3 3l3-3m-8.25 6a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"></path></svg></button>
                </div>
            </header>

            <div class="desktop-layout">
                <div class="main-card animate-fade-up delay-1">
                    <div class="label">Estimasi Saat Ini</div>
                    <div id="display-rp" class="total-display">Rp 0</div>
                    <div class="settings-row"><div id="badge-price" class="setting-badge" onclick="changePrice()">...</div><div id="badge-unit" class="setting-badge" onclick="changeUnit()">...</div></div>
                    <div class="input-group">
                        <input type="number" id="input-qty" placeholder="0">
                        <button id="btn-clear" class="btn-clear" onclick="resetInput()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                        <div id="input-label" class="label" style="margin-top: 16px;">Jumlah...</div>
                    </div>
                    <button onclick="saveData()" class="btn-main">SIMPAN KE RIWAYAT</button>
                </div>

                <div class="history-section animate-fade-up delay-2" id="history-container"></div>
            </div>
            <input type="file" id="file-restore" accept=".json" style="display: none;" onchange="restoreData(event)">
        </div>

        <div class="watermark-footer">Built with precision by <strong>Ardadinata</strong>.<br>Digital Strategy & Development 2026.</div>
    </div>

    <script>
        const input = document.getElementById('input-qty'); const display = document.getElementById('display-rp'); const container = document.getElementById('history-container');
        const badgePrice = document.getElementById('badge-price'); const badgeUnit = document.getElementById('badge-unit'); const inputLabel = document.getElementById('input-label');
        const btnClear = document.getElementById('btn-clear'); const weatherEl = document.getElementById('weather'); let toastTimeout;
        
        let currentPrice = parseInt(localStorage.getItem('otrack_price')) || 7200; let currentUnit = localStorage.getItem('otrack_unit') || 'Karung';

        function escapeHTML(str) { return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

        updateSettingsDisplay(); renderHistory(); initWeather();
        input.addEventListener('input', updateDisplay);

        function initWeather() {
            const cached = localStorage.getItem('otrack_weather'); if (cached) weatherEl.innerText = cached;
            if (navigator.geolocation) { navigator.geolocation.getCurrentPosition( (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude), (err) => { fetchWeather(-6.2088, 106.8456); }, { timeout: 5000 } ); } 
            else { weatherEl.innerText = "❌ GPS Off"; }
        }

        async function fetchWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`); const data = await res.json();
                const temp = Math.round(data.current_weather.temperature); const code = data.current_weather.weathercode;
                let icon = '☁️'; if (code === 0) icon = '☀️ Cerah'; else if (code > 0 && code < 4) icon = '⛅ Berawan'; else if (code >= 51 && code <= 67 || code >= 80 && code <= 82) icon = '🌧️ Hujan'; else if (code >= 95) icon = '⛈️ Badai';
                const wStr = `${icon} • ${temp}°C`; weatherEl.innerText = wStr; localStorage.setItem('otrack_weather', wStr);
            } catch (e) { if(!localStorage.getItem('otrack_weather')) weatherEl.innerText = "📡 Offline"; }
        }

        function updateSettingsDisplay() { badgePrice.innerText = `Rp ${currentPrice.toLocaleString('id-ID')} / ${currentUnit}`; badgeUnit.innerText = `Satuan: ${currentUnit}`; inputLabel.innerText = `Jumlah ${currentUnit}`; }

        function changePrice() {
            const nPrice = prompt(`Harga per ${currentUnit}:`, currentPrice);
            if (nPrice !== null && nPrice !== "") { const p = parseInt(nPrice); if (!isNaN(p) && p > 0) { currentPrice = p; localStorage.setItem('otrack_price', currentPrice); updateSettingsDisplay(); updateDisplay(); } else { alert('Angka gak valid!'); } }
        }

        function changeUnit() {
            const nUnit = prompt('Satuan baru (maks. 15 huruf):', currentUnit);
            if (nUnit !== null && nUnit.trim() !== "") { const t = nUnit.trim(); if (t.length > 15) { alert('Kepanjangan!'); return; } currentUnit = t; localStorage.setItem('otrack_unit', currentUnit); updateSettingsDisplay(); renderHistory(); }
        }

        function updateDisplay() {
            const val = parseInt(input.value) || 0; display.innerText = formatRp(val * currentPrice);
            if (input.value.length > 0) { btnClear.classList.add('show'); } else { btnClear.classList.remove('show'); }
        }

        function resetInput() { input.value = ''; updateDisplay(); input.focus(); }
        function formatRp(n) { return 'Rp ' + n.toLocaleString('id-ID'); }

        function saveData() {
            const val = parseInt(input.value) || 0; if (val <= 0) return;
            const total = val * currentPrice; const now = new Date();
            const dtStr = `${now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })} • ${now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB`;
            showToast('DATA TERSIMPAN');
            const logs = JSON.parse(localStorage.getItem('otrack_offline') || '[]'); logs.unshift({ val, total, datetime: dtStr }); localStorage.setItem('otrack_offline', JSON.stringify(logs)); 
            renderHistory(); resetInput();
        }

        function deleteItem(idx) { const logs = JSON.parse(localStorage.getItem('otrack_offline') || '[]'); logs.splice(idx, 1); localStorage.setItem('otrack_offline', JSON.stringify(logs)); renderHistory(); }

        function exportReport(tQty, tMoney) {
            const now = new Date(); const t = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); const d = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            const txt = `*LAPORAN O-TRACK*\nTanggal: ${d}\nJam: ${t} WIB\n\n- Total ${currentUnit}: ${tQty} ${currentUnit}\n- Total Estimasi: ${formatRp(tMoney)}\n\n_Generated by O-Track_`;
            if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(() => showToast('LAPORAN DISALIN!')).catch(()=>alert('Gagal!')); } 
            else { const el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); el.select(); try { document.execCommand('copy'); showToast('LAPORAN DISALIN!'); } catch (err) {} document.body.removeChild(el); }
        }

        function renderHistory() {
            const logs = JSON.parse(localStorage.getItem('otrack_offline') || '[]'); const safeUnit = escapeHTML(currentUnit); 
            if (logs.length === 0) { container.innerHTML = '<div class="label" style="margin-bottom: 12px;">Riwayat Data</div><div class="main-card" style="padding: 24px; box-shadow: none; border: 1px dashed rgba(255, 255, 255, 0.1); background: transparent;"><p style="margin:0; font-weight: 600; color: var(--text-dim); font-size: 0.75rem;">BELUM ADA DATA</p></div>'; return; }
            let tQty = 0; let tMoney = 0; logs.forEach(i => { tQty += i.val; tMoney += i.total; });
            let h = `
                <div class="summary-card animate-fade-up">
                    <div class="summary-header"><span>Total Keseluruhan</span><button onclick="exportReport(${tQty}, ${tMoney})" class="btn-export"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>SALIN</button></div>
                    <div class="summary-body"><div class="summary-qty">${tQty}<span>${safeUnit}</span></div><div class="summary-rp">${formatRp(tMoney)}</div></div>
                </div><div class="label animate-fade-up" style="margin-bottom: 16px; margin-top: 32px; animation-delay: 0.1s;">Rincian Riwayat</div>
            `;
            h += logs.map((i, idx) => {
                const dt = i.datetime ? i.datetime : (i.time ? i.time + ' WIB' : '-'); const ad = idx < 10 ? idx + 2 : 10; 
                return `<div class="history-item" style="--delay: ${ad};"><div><div class="history-item-qty">${i.val} <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-dim);">${safeUnit}</span></div><div class="history-item-time">${escapeHTML(dt)}</div></div><div class="history-right"><div class="history-item-total">${formatRp(i.total)}</div><button onclick="deleteItem(${idx})" class="btn-del-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button></div></div>`;
            }).join(''); container.innerHTML = h;
        }

        function backupData() {
            const db = { price: localStorage.getItem('otrack_price'), unit: localStorage.getItem('otrack_unit'), history: localStorage.getItem('otrack_offline') };
            const blob = new Blob([JSON.stringify(db)], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `OTrack_Backup_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); showToast('BACKUP BERHASIL');
        }

        function triggerRestore() { document.getElementById('file-restore').click(); }

        function restoreData(e) {
            const f = e.target.files[0]; if (!f) return; const r = new FileReader();
            r.onload = function(ev) {
                try { const d = JSON.parse(ev.target.result); if (d.price) localStorage.setItem('otrack_price', d.price); if (d.unit) localStorage.setItem('otrack_unit', d.unit); if (d.history) localStorage.setItem('otrack_offline', d.history); currentPrice = parseInt(d.price) || 7200; currentUnit = d.unit || 'Karung'; updateSettingsDisplay(); renderHistory(); showToast('RESTORE BERHASIL'); } 
                catch (err) { alert('Gagal!'); } e.target.value = '';
            }; r.readAsText(f);
        }
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; t.classList.add('show'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => t.classList.remove('show'), 2500); }
    </script>
</body>
</html>
